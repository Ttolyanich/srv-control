{% extends "base.html" %}

{% block title %}Смена пароля | SRV-Control{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">Безопасность</h1>
        <p class="page-subtitle">Самостоятельная смена пароля для вашей учетной записи</p>
    </div>
</div>

<div class="card" style="max-width: 500px; margin: 0 auto;">
    <h2 style="font-family: var(--font-title); font-size: 18px; font-weight: 600; margin-bottom: 24px; color: #ffffff; border-bottom: 1px solid var(--border-color); padding-bottom: 12px;">
        Сменить пароль
    </h2>



    <form action="{{ url_for('change_password') }}" method="POST" onsubmit="return validatePasswords()">
        <div class="form-group">
            <label for="current_password" style="display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 8px;">Текущий пароль</label>
            <input type="password" id="current_password" name="current_password" class="form-control" required>
        </div>
        <div class="form-group" style="margin-top: 20px;">
            <label for="new_password" style="display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 8px;">Новый пароль</label>
            <input type="password" id="new_password" name="new_password" class="form-control" required>
        </div>
        <div class="form-group" style="margin-top: 20px;">
            <label for="confirm_password" style="display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 8px;">Подтверждение нового пароля</label>
            <input type="password" id="confirm_password" name="confirm_password" class="form-control" required>
            <span id="password-error" style="color: #ff4a4a; font-size: 11px; margin-top: 6px; display: none;">Пароли не совпадают!</span>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 30px;">
            <a href="{{ url_for('index') }}" class="btn btn-secondary" style="display: inline-flex; align-items: center;">Отмена</a>
            <button type="submit" class="btn btn-primary">Обновить пароль</button>
        </div>
    </form>
</div>

<script>
function validatePasswords() {
    var newPass = document.getElementById('new_password').value;
    var confirmPass = document.getElementById('confirm_password').value;
    var errorSpan = document.getElementById('password-error');
    
    if (newPass !== confirmPass) {
        errorSpan.style.display = 'block';
        return false;
    }
    errorSpan.style.display = 'none';
    return true;
}
</script>
{% endblock %}
