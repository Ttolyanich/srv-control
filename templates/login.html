<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему | SRV-Control</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='url(%23grad)'/><defs><linearGradient id='grad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%239D071E'/><stop offset='100%25' stop-color='%23e63946'/></linearGradient></defs><path d='M25 32h50v9H25zm0 15h50v9H25zm0 15h50v9H25z' fill='white'/></svg>">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            z-index: 2;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-logo {
            font-family: var(--font-title);
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent-red) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .brand-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .login-card {
            padding: 40px;
        }

        .login-title {
            font-family: var(--font-title);
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 24px;
            color: var(--text-primary);
            text-align: center;
        }

        /* Позиционирование кнопки переключения темы */
        .theme-toggle-container {
            position: absolute;
            top: 24px;
            right: 24px;
            z-index: 10;
        }
        
        .theme-toggle-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 16px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
        }
        
        .theme-toggle-btn:hover {
            color: var(--text-primary);
            background-color: var(--bg-card-hover);
        }

        .alert-error {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 8px;
            padding: 12px 16px;
            color: var(--status-offline);
            font-size: 13px;
            margin-bottom: 24px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <!-- Предотвращение мигания темы при начальной загрузке -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            if (savedTheme === 'light') {
                document.body.classList.add('light-theme');
            }
        })();
    </script>

    <!-- Кнопка смены темы в правом верхнем углу -->
    <div class="theme-toggle-container">
        <button class="theme-toggle-btn" id="theme-toggle-btn" onclick="toggleTheme()">
            <!-- Sun Icon (visible in Dark theme) -->
            <svg class="sun-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <!-- Moon Icon (visible in Light theme) -->
            <svg class="moon-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <span id="theme-btn-text">Светлая тема</span>
        </button>
    </div>

    <div class="login-container">
        <div class="brand-header">
            <div class="brand-logo">SRV-Control</div>
            <div class="brand-subtitle">Панель управления инфраструктурой</div>
        </div>

        <div class="card login-card">
            <h2 class="login-title">Авторизация</h2>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert-error">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('login') }}" method="POST">
                <div class="form-group">
                    <label for="username" style="display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 8px;">Имя пользователя</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Введите ваш логин" required autofocus>
                </div>
                <div class="form-group" style="margin-top: 20px;">
                    <label for="password" style="display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 8px;">Пароль</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Введите ваш пароль" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 28px; padding: 12px 20px;">Войти в систему</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const isLight = document.body.classList.contains('light-theme');
            updateThemeButtonUI(isLight);
        });

        function toggleTheme() {
            const body = document.body;
            body.classList.toggle('light-theme');
            const isLight = body.classList.contains('light-theme');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            updateThemeButtonUI(isLight);
        }

        function updateThemeButtonUI(isLight) {
            const sunIcon = document.querySelector('.sun-icon');
            const moonIcon = document.querySelector('.moon-icon');
            const btnText = document.getElementById('theme-btn-text');
            
            if (isLight) {
                sunIcon.style.display = 'inline-block';
                moonIcon.style.display = 'none';
                btnText.innerText = 'Тёмная тема';
            } else {
                sunIcon.style.display = 'none';
                moonIcon.style.display = 'inline-block';
                btnText.innerText = 'Светлая тема';
            }
        }
    </script>
</body>
</html>
